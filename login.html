<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie — Minimal</title>
    <!-- Korzysta z Twojego istniejącego pliku style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ANIMOWANE TŁO CANVAS (to samo co na stronie głównej) -->
    <canvas id="bg-canvas"></canvas>

    <!-- NAGŁÓWEK Z MOTYWEM I ZEGAREM -->
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">minimal</div>
            <div class="header-actions">
                <div class="clock-box">
                    <span id="clock-time">00:00:00</span>
                    <span id="clock-date">Data</span>
                </div>
                <button id="theme-switch" class="theme-btn" aria-label="Zmień motyw" aria-checked="true">
                    🌓
                </button>
            </div>
        </div>
    </header>

    <!-- GŁÓWNA SEKCJA LOGOWANIA -->
    <main class="container main-content" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
        <div class="card" style="width: 100%; max-width: 400px; text-align: center; padding: 2.5rem;">
            <h2 style="margin-bottom: 0.5rem; font-weight: 600;">Strefa chroniona</h2>
            <p style="color: var(--text-muted, #888); font-size: 0.95rem; margin-bottom: 2rem;">Wpisz hasło, aby uzyskać dostęp do panelu.</p>
            
            <form id="login-form">
                <input type="password" id="login-password" placeholder="Wpisz hasło..." required autocomplete="current-password" style="width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border-color, rgba(255,255,255,0.15)); background: var(--input-bg, rgba(0,0,0,0.1)); color: var(--text-color); font-size: 1rem; margin-bottom: 1rem; outline: none;">
                <button type="submit" class="btn-primary" style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--accent-color, #111); color: #fff; border: none; font-weight: 500; cursor: pointer;">Wejdź</button>
            </form>
            <p id="login-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 1rem;" hidden>Błędne hasło. Spróbuj ponownie.</p>
        </div>
    </main>

    <!-- SKRYPT OBSŁUGUJĄCY LOGOWANIE ORAZ TŁO/ZEGAR -->
    <script src="script.js"></script>
    <script>
        // Logika logowania dopasowana do login.html
        document.addEventListener("DOMContentLoaded", () => {
            const AUTH_PASSWORD = "twoje-tajne-haslo"; // <-- Zmień na własne hasło!
            const form = document.getElementById("login-form");
            const input = document.getElementById("login-password");
            const error = document.getElementById("login-error");

            // Jeśli użytkownik jest już zalogowany, od razu przekieruj go na index.html
            if (sessionStorage.getItem("isAuthorized") === "true") {
                window.location.href = "index.html";
                return;
            }

            if (form) {
                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    if (input.value === AUTH_PASSWORD) {
                        sessionStorage.setItem("isAuthorized", "true");
                        window.location.href = "index.html"; // Przekierowanie do Twojej strony głównej
                    } else {
                        error.hidden = false;
                        input.value = "";
                        input.focus();
                    }
                });
            }
        });
    </script>
</body>
</html>
